
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pink Products | Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="store-header">
        <h1>Pink Products</h1>
        <button id="logoutBtn" type="button">Logout</button>
    </header>

    <main class="store-container">
        <section class="welcome-section">
            <h2>Our Products</h2>
            <p>Browse our available products.</p>
        </section>

        <section id="adminSection" hidden>
            <h3>Add New Product</h3>

            <form id="productForm">
                <label for="productName">Product Name</label>
                <input type="text" id="productName" required>

                <label for="productPrice">Price</label>
                <input type="number" id="productPrice" min="0" step="0.01" required>

                <label for="salePrice">Sale Price</label>
                <input type="number" id="salePrice" min="0" step="0.01" required>

                <button class="submit-btn" type="submit">Add Product</button>
            </form>
        </section>

        <p id="productMessage"></p>

        <section id="productList" class="product-list"></section>
    </main>

    <script src="products.js"></script>
</body>
</html>
